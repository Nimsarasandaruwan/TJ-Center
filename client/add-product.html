<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
TJ Center | Add Product
</title>



<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<link rel="stylesheet" href="css/add-product.css">



</head>



<body>





<div class="container">



<h1>

Add New Product

</h1>






<form id="productForm" enctype="multipart/form-data">





<label>

Product Name

</label>


<input

type="text"

id="name"

name="name"

placeholder="Enter product name"

required

>







<label>

Description

</label>


<textarea

id="description"

name="description"

placeholder="Product description"

></textarea>







<label>

Price

</label>


<input

type="number"

id="price"

name="price"

placeholder="Enter price"

required

>







<label>

Category

</label>


<input

type="text"

id="category"

name="category"

placeholder="Example: Electronics"

required

>







<label>

Brand

</label>


<input

type="text"

id="brand"

name="brand"

placeholder="Brand name"

>








<label>

Discount (%)

</label>


<input

type="number"

id="discount"

name="discount"

value="0"

>







<label>

Stock

</label>


<input

type="number"

id="stock"

name="stock"

value="0"

>







<label>

Product Image

</label>



<input

type="file"

id="image"

name="image"

accept="image/*"

onchange="previewImage(event)"

>







<img

id="preview"

src=""

alt="Image Preview"

>







<button

type="submit"

>

Add Product

</button>






<button

type="button"

class="back"

onclick="goBack()"

>

Back

</button>






</form>





</div>







<script src="js/add-product.js"></script>



</body>


</html>
