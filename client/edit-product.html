<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>

TJ Center | Edit Product

</title>




<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<link rel="stylesheet" href="css/edit-product.css">



</head>



<body>






<div class="container">





<h1>

Edit Product

</h1>







<form id="editProductForm">






<label>

Product Name

</label>


<input

type="text"

id="name"

required

>








<label>

Description

</label>


<textarea

id="description"

></textarea>








<label>

Price

</label>


<input

type="number"

id="price"

required

>








<label>

Category

</label>


<input

type="text"

id="category"

required

>








<label>

Brand

</label>


<input

type="text"

id="brand"

>








<label>

Discount (%)

</label>


<input

type="number"

id="discount"

>








<label>

Stock

</label>


<input

type="number"

id="stock"

>









<label>

Change Image

</label>



<input

type="file"

id="image"

accept="image/*"

onchange="previewImage(event)"

>







<img

id="preview"

>










<button

type="submit"

>

Update Product

</button>







<button

type="button"

class="back"

onclick="goBack()"

>

Back

</button>








</form>






</div>









<script src="js/edit-product.js"></script>




</body>


</html>
